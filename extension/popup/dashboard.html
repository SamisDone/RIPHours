<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RIPHours — Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-page="dashboard">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="dot"></div>
      <span class="brand">RIPHours</span>
    </div>
    <span class="since" id="since"></span>
  </div>

  <!-- Tab nav -->
  <div class="tabs">
    <a href="dashboard.html" class="tab active">Stats</a>
    <a href="limits.html" class="tab">Limits</a>
    <a href="settings.html" class="tab">Settings</a>
  </div>

  <div class="tab-content active">
    <div class="hero">
      <div class="time-big" id="hero-time">0d 0h 0m 0s</div>
      <div class="time-label">of your life spent on tracked sites</div>
      <div id="active-session-label" class="active-session-label" style="display: none;"></div>
      <div class="time-toggle">
        <button class="toggle-btn active" data-view="total">All Time</button>
        <button class="toggle-btn" data-view="today">Today</button>
      </div>
      <button id="btn-focus-surge" class="btn btn-focus">
        ⚡ Start Focus Surge (25m)
      </button>
    </div>

    <!-- Search -->
    <div class="search-row">
      <input type="text" class="search-input" id="search" placeholder="Search sites...">
    </div>

    <div class="chart-section">
      <div class="section-title">time sink breakdown</div>
      <div id="chart"></div>
    </div>

    <!-- Weekly trends -->
    <div class="trends-section">
      <div class="section-title">last 7 days</div>
      <div class="trend-chart" id="trend-chart"></div>
    </div>

    <div class="share-row" id="share-trigger-row">
      <button class="btn btn-primary" id="btn-share">Share Shock Card</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Share Card Overlay -->
  <div class="overlay" id="share-card-container">
    <div class="modal-box share-modal-box">
      <div id="card" class="share-card">
        <div class="card-logo">RIPHours</div>
        <div class="card-center">
          <div class="card-time" id="card-time">0d 0h 0m</div>
          <div class="card-units">of my life</div>
          <div class="card-tagline">Tracked with RIPHours.<br>Time is finite.</div>
        </div>
        <div class="card-footer">riphours · private local tracking</div>
      </div>
      <div class="share-actions">
         <button class="btn btn-secondary btn-small" id="btn-close-share">Close</button>
         <button class="btn btn-primary btn-small" id="btn-copy-share">Copy Image</button>
      </div>
    </div>
  </div>

  <script src="../lib/html2canvas.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
