<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Blocked · RIPHours</title>
  <link rel="icon" href="../../icons/icon32.png">
  <script src="../../shared/boot-theme.js"></script>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="../../shared/page.css">
  <link rel="stylesheet" href="blocked.css">
  <script type="module" src="blocked.js"></script>
</head>
<body>
  <main class="page reveal">
    <p class="eyebrow caps">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M4 1.75h8M4 14.25h8M5 1.75c0 3.6 3 4.3 3 6.25S5 10.65 5 14.25M11 1.75c0 3.6-3 4.3-3 6.25s3 2.65 3 6.25"
          fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.1 13.4 8 11.3l1.9 2.1Z" fill="var(--accent)"/>
      </svg>
      RIPHours
    </p>
    <h1 class="display" id="title">Blocked.</h1>
    <p class="lede tnum" id="lede" aria-live="polite"></p>
    <div class="countdown" id="countdown" hidden aria-hidden="true"><span id="countdown-bar"></span></div>
    <aside class="instead" id="instead" hidden>
      <span class="caps">Do this instead</span>
      <p id="instead-text"></p>
    </aside>
    <div class="actions">
      <a class="btn primary" id="back" hidden></a>
    </div>
  </main>
</body>
</html>
