<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚰ Blocked — RIPHours</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('../../fonts/Inter-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Inter';
      src: url('../../fonts/Inter-Bold.woff2') format('woff2');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Inter';
      src: url('../../fonts/Inter-Black.woff2') format('woff2');
      font-weight: 900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0D0D;
      color: #F1FAEE;
      font-family: "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .box { text-align: center; max-width: 420px; padding: 40px; }
    h1 { font-size: 52px; font-weight: 900; color: #E63946; margin-bottom: 16px; }
    .site { font-size: 20px; font-weight: 700; color: #E63946; margin-bottom: 8px; }
    p { font-size: 15px; color: rgba(241,250,238,0.6); line-height: 1.6; margin-bottom: 28px; }
    .note { font-size: 12px; color: #52525b; }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚰</h1>
    <div class="site" id="site-name"></div>
    <p>You've hit your daily limit for this site.<br>RIPHours has blocked access for the rest of the day.</p>
    <p id="touch-grass-text" class="note">Close this tab. Go outside. Touch grass.<br>The block resets at midnight.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
