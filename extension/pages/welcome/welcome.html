<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to RIPHours</title>
  <style>
    :root {
      --bg: #09090b;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --accent: #ef4444;
      --border: rgba(255, 255, 255, 0.05);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @font-face {
      font-family: 'Inter';
      src: url('../../fonts/Inter-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Inter';
      src: url('../../fonts/Inter-Bold.woff2') format('woff2');
      font-weight: 700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      max-width: 560px;
      text-align: center;
      padding: 60px 40px;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 20px;
      color: var(--text);
    }

    .tagline {
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 40px;
    }
    
    .tagline strong {
      color: var(--accent);
      font-weight: 600;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
      text-align: left;
    }

    .info-box h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 16px;
      font-weight: 600;
    }

    ul {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      list-style: none;
    }

    li {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    li::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.6;
    }

    .note {
      color: #52525b;
      font-size: 13px;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 40px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }

    .btn:hover {
      background: #dc2626;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>RIPHours</h1>
    <p class="tagline">Your scroll history, measured in <strong>days of your life</strong>.</p>
    
    <div class="info-box">
      <h3>Active Tracking</h3>
      <ul>
        <li>reddit.com</li>
        <li>youtube.com</li>
        <li>twitter.com / x.com</li>
        <li>instagram.com</li>
        <li>tiktok.com</li>
        <li>facebook.com</li>
      </ul>
    </div>

    <p class="note">All data stays local. No accounts. No telemetry.<br>Click the extension icon to see your stats.</p>
    
    <button class="btn" id="close-btn">Proceed</button>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
